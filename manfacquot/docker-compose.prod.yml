version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: quotanic_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: QuotanicDB2026!
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://postgres:QuotanicDB2026!@db:5432/quotanic_db
      - ALLOWED_HOSTS=localhost,127.0.0.1,52.66.209.255,api.quotanic.com
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    restart: always

  celery:
    build: .
    command: micromamba run -n base celery -A gmqp_project worker --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:QuotanicDB2026!@db:5432/quotanic_db
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - redis
      - web

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl.conf.template:/etc/nginx/templates/ssl.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./media:/app/media
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-quotanic.com}
    depends_on:
      - web
