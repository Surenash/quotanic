version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: always

  celery:
    build: .
    command: celery -A gmqp_project worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    depends_on:
      - redis
      - web

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template
      - ./media:/app/media
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    depends_on:
      - web
