version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - node -v
        - cd manfacquot
        - npm install
    build:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=4096"
        - npm run build
  artifacts:
    baseDirectory: manfacquot/dist
    files:
      - '**/*'
  cache:
    paths:
      - manfacquot/node_modules/**/*
